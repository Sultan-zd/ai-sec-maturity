# Nginx : sert l'application React et relaie l'API vers le backend.
# Le navigateur ne voit qu'une seule origine → pas de CORS, jeton jamais envoyé à un tiers.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # En-têtes de sécurité (OWASP Secure Headers)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    # API et documentation Swagger → backend Spring Boot
    location ~ ^/(api|v3/api-docs|swagger-ui)(/|\.html|$) {
        proxy_pass http://backend:8090;
        # $http_host garde le port (localhost:8088) : Spring reconnaît alors une requête de même origine.
        # Avec $host (sans port), la requête serait vue comme cross-origin et rejetée par CORS (403).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }

    # Fichiers générés par Vite : nom unique (hash) → cache long
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Application monopage : toute autre route renvoie index.html (React Router)
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
