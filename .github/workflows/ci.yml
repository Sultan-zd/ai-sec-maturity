# Intégration continue AIMA : chaque push et chaque pull request sont vérifiés automatiquement.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  referential:
    name: Référentiel (cohérence JSON)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/referential-tool.mjs --check
      # La grille Markdown est générée : elle doit être à jour avec le JSON
      - name: Grille d'audit à jour
        run: |
          node scripts/referential-tool.mjs
          git diff --exit-code -- docs/03b-grille-audit-detaillee.md \
            || (echo "::error::docs/03b n'est pas à jour : lancer node scripts/referential-tool.mjs" && exit 1)

  backend:
    name: Backend (tests Java + PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Tests unitaires + tests d'intégration sur un vrai PostgreSQL (Testcontainers, Docker du runner)
      - run: ./mvnw -B verify
      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build          # inclut la vérification TypeScript (tsc -b)

  docker:
    name: Images Docker
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Image backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: aima-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Image frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: aima-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
