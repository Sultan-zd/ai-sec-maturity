# Mises à jour automatiques des dépendances (correctifs de sécurité) : une PR par semaine et par écosystème
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /scripts
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
